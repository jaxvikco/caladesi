name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Caladesi.slnx

      - name: Format (verify)
        run: dotnet format style Caladesi.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Caladesi.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution Caladesi.slnx --no-build --configuration Release
